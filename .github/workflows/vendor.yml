name: Universal Vendor
on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL сайта (например, https://example.gamma.site/)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          pip install playwright beautifulsoup4
          python -m playwright install chromium --with-deps
      - name: Run vendor
        env:
          TARGET_URL: ${{ github.event.inputs.target_url }}
        run: xvfb-run --auto-servernum python3 vendor.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Vendor: ${{ github.event.inputs.target_url }}" || echo "no changes"
          git push
